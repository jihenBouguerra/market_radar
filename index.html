<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Market Intelligence — 3 Pilot Accounts</title>
<script>
  // Apply saved theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      if (stored === 'dark' || stored === 'light') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #0f0f14;
    --panel: #1a1a23;
    --surface: #1a1a23;
    --panel2: #232330;
    --surface-2: #232330;
    --surface-3: #2a2a3a;
    --border: #2e2e3e;
    --border-strong: #3d3d52;
    --text: #ececf1;
    --muted: #9494a8;
    --text-dim: #9494a8;
    --text-faint: #5a5a72;
    --accent: #8b7cf6;
    --accent-soft: rgba(139,124,246,0.15);
    --good: #4ade80;
    --green: #4ade80;
    --good-soft: rgba(74,222,128,0.14);
    --danger: #f87171;
    --red: #f87171;
    --danger-soft: rgba(248,113,113,0.14);
    --warn: #fbbf24;
    --yellow: #facc15;
    --warn-soft: rgba(251,191,36,0.14);
    --radius: 16px;
    --radius-pill: 999px;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.25);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f7fb; --panel: #ffffff; --surface: #ffffff; --panel2: #f0f0f6; --surface-2: #f0f0f6; --surface-3: #e7e7f0;
      --border: #e3e3ec; --border-strong: #c9c9dc;
      --text: #17171f; --muted: #6b6b7d; --text-dim: #6b6b7d; --text-faint: #8f8fa3;
      --accent: #7c6cf0; --accent-soft: rgba(124,108,240,0.12);
      --good: #16a34a; --green: #16a34a; --good-soft: rgba(22,163,74,0.12);
      --danger: #dc4a4a; --red: #dc4a4a; --danger-soft: rgba(220,74,74,0.1);
      --warn: #b45309; --yellow: #b45309; --warn-soft: rgba(180,83,9,0.12);
      --card-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7fb; --panel: #ffffff; --surface: #ffffff; --panel2: #f0f0f6; --surface-2: #f0f0f6; --surface-3: #e7e7f0;
    --border: #e3e3ec; --border-strong: #c9c9dc;
    --text: #17171f; --muted: #6b6b7d; --text-dim: #6b6b7d; --text-faint: #8f8fa3;
    --accent: #7c6cf0; --accent-soft: rgba(124,108,240,0.12);
    --good: #16a34a; --green: #16a34a; --good-soft: rgba(22,163,74,0.12);
    --danger: #dc4a4a; --red: #dc4a4a; --danger-soft: rgba(220,74,74,0.1);
    --warn: #b45309; --yellow: #b45309; --warn-soft: rgba(180,83,9,0.12);
    --card-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #0f0f14; --panel: #1a1a23; --surface: #1a1a23; --panel2: #232330; --surface-2: #232330; --surface-3: #2a2a3a;
    --border: #2e2e3e; --border-strong: #3d3d52;
    --text: #ececf1; --muted: #9494a8; --text-dim: #9494a8; --text-faint: #5a5a72;
    --accent: #8b7cf6; --accent-soft: rgba(139,124,246,0.15);
    --good: #4ade80; --green: #4ade80; --good-soft: rgba(74,222,128,0.14);
    --danger: #f87171; --red: #f87171; --danger-soft: rgba(248,113,113,0.14);
    --warn: #fbbf24; --yellow: #facc15; --warn-soft: rgba(251,191,36,0.14);
    --card-shadow: 0 4px 24px rgba(0,0,0,0.25);
  }

  /* Theme toggle (light / dark) */
  .theme-toggle { position: fixed; top: 14px; right: 16px; z-index: 200; width: 36px; height: 36px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--card-shadow); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; transition: border-color .15s, background .15s; }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle .icon-moon { display: none; }
  .theme-toggle .icon-sun { display: block; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .theme-toggle .icon-moon { display: block; }
    :root:not([data-theme="dark"]) .theme-toggle .icon-sun { display: none; }
  }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* Fixed categorical colors for the two signal channels — constant across themes */
  .c-newstype { color: #14b8a6; } .bg-newstype { background: #5eead4; }
  .c-socialtype { color: #7c3aed; } .bg-socialtype { background: #a78bfa; }
  @media (prefers-color-scheme: dark) {
    .c-newstype { color: #5eead4; } .c-socialtype { color: #a78bfa; }
  }
  :root[data-theme="dark"] .c-newstype { color: #5eead4; }
  :root[data-theme="dark"] .c-socialtype { color: #a78bfa; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; color: inherit; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 32px 80px; }

  .app-title { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .app-title .spark { color: var(--accent); }
  .app-title .pilot-tag { font-weight: 500; color: var(--muted); font-size: 16px; }
  .app-sub { color: var(--muted); font-size: 13.5px; max-width: 76ch; margin: 0 0 18px; }

  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-faint); margin-bottom: 14px; flex-wrap: wrap; }
  .breadcrumb button { background: none; border: none; cursor: pointer; padding: 1px 3px; color: var(--muted); font-size: 12.5px; border-radius: 4px; }
  .breadcrumb button:hover { color: var(--accent); }
  .breadcrumb .current { color: var(--text); font-weight: 600; }
  .breadcrumb .sep { color: var(--border-strong); }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: var(--radius-pill); font-size: 12.5px; border: 1px solid var(--border); white-space: nowrap; }
  .pill.outline { color: var(--muted); background: transparent; }
  .pill.primary-btn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .pill.primary-btn:hover { filter: brightness(1.08); }
  .pill.live-pill { color: var(--good); background: var(--good-soft); border-color: transparent; font-weight: 500; }
  .pill.live-pill b { background: var(--good); color: #06280f; font-size: 10px; font-weight: 800; letter-spacing: 0.03em; padding: 1px 6px; border-radius: var(--radius-pill); margin-left: 2px; }

  .action-row { display: flex; gap: 10px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }

  /* Account switcher */
  .account-switch-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .account-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 9px 16px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .account-pill:hover { border-color: var(--border-strong); }
  .account-pill .ind-tag { font-weight: 500; color: var(--text-faint); font-size: 11.5px; }
  .account-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .account-pill.active .ind-tag { color: rgba(255,255,255,0.75); }
  .account-pill.add-new { background: transparent; border-style: dashed; color: var(--muted); }
  .account-pill.add-new:hover { color: var(--accent); border-color: var(--accent); }

  .config-note { color: var(--text-faint); font-size: 12px; margin: 0 0 20px; }

  hr.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0 22px; }

  .callout {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 26px; font-size: 13px; color: var(--text); line-height: 1.6;
  }
  .callout b.label { color: var(--warn); }
  .callout.accent b.label { color: var(--accent); }

  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 4px; }
  .section-head h2 { font-size: 17px; margin: 0; font-weight: 700; }
  .section-sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 22px; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card h3 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.005em; }
  .card-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag-pill { font-size: 11px; color: var(--muted); background: var(--panel2); border: 1px solid var(--border); padding: 3px 9px; border-radius: var(--radius-pill); }
  .card-desc { color: var(--muted); font-size: 12.8px; line-height: 1.55; margin: 0 0 14px; }

  .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; font-size: 12.5px; }
  .foot-meta { color: var(--muted); font-family: var(--mono); }
  .foot-link { color: var(--accent); font-weight: 700; }

  .conf-pill.high { color: var(--good); background: var(--good-soft); border-color: transparent; }
  .conf-pill.medium { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .conf-pill.low { color: var(--danger); background: var(--danger-soft); border-color: transparent; }

  .stage-pill { cursor: pointer; font-weight: 650; }
  .stage-pill.cold { color: var(--text-faint); background: var(--panel2); border-color: var(--border); }
  .stage-pill.warm { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .stage-pill.in-conversation { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .stage-pill.won { color: var(--good); background: var(--good-soft); border-color: transparent; }
  .stage-pill.lost { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
  .stage-pill.active { outline: 2px solid currentColor; outline-offset: 1px; }

  /* Account profile strip */
  .account-strip {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .avatar { width: 46px; height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; font-family: var(--mono); flex-shrink: 0; }
  .account-strip h2 { margin: 0; font-size: 17px; }
  .account-strip .sector-line { color: var(--text-faint); font-size: 12px; margin-top: 2px; }
  .account-facts { display: flex; gap: 26px; margin-left: auto; flex-wrap: wrap; }
  .account-facts .fact-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  .account-facts .fact-value { font-size: 13px; margin-top: 3px; font-family: var(--mono); }

  /* View tabs (Signals & Offers / Client Setup) */
  .view-tabs { display: flex; gap: 0; margin: 0 0 22px; border-bottom: 1px solid var(--border); }
  .view-tab { background: none; border: none; padding: 10px 4px; margin-right: 22px; font-size: 13.5px; font-weight: 650; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .view-tab:hover { color: var(--text); }
  .view-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Two-column signal feed */
  .signal-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 8px; }
  .signal-col { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
  .signal-col-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .signal-col-head h3 { margin: 0; font-size: 15px; }
  .signal-col .col-sub { color: var(--muted); font-size: 12px; margin: 2px 0 16px; }

  .timeline-item { display: grid; grid-template-columns: 78px 1fr; gap: 14px; padding: 12px 0; }
  .timeline-item:not(:last-child) { border-bottom: 1px dashed var(--border); }
  .timeline-item.clickable { cursor: pointer; border-radius: 8px; margin: 0 -8px; padding: 12px 8px; }
  .timeline-item.clickable:hover { background: var(--panel2); }
  .timeline-date { font-family: var(--mono); font-size: 11px; color: var(--text-faint); padding-top: 2px; }
  .evidence-type { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 5px; background: var(--panel2); padding: 2px 8px; border-radius: var(--radius-pill); }
  .timeline-item p { margin: 0; font-size: 12.8px; color: var(--text); line-height: 1.55; }
  .signal-source { font-size: 10.5px; color: var(--text-faint); margin-top: 5px; font-style: italic; }

  .post-quote { font-size: 14.5px; line-height: 1.65; color: var(--text); padding: 16px 18px; background: var(--panel2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; margin: 14px 0 18px; }

  .contact-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; flex-wrap: wrap; }

  .sig-ref-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); background: var(--panel2); border: 1px solid var(--border); }

  /* Client Setup panels */
  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-bottom: 8px; }
  .setup-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; cursor: default; }
  .setup-panel-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .setup-panel-head h3 { margin: 0; font-size: 15px; }
  .setup-panel .col-sub { color: var(--muted); font-size: 12px; margin: 2px 0 16px; }

  .list-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .list-row:last-child { border-bottom: none; }
  .list-row-main { flex: 1; min-width: 0; }
  .list-row-name { font-weight: 650; font-size: 13px; }
  .list-row-sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .list-row-meta { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); white-space: nowrap; text-align: right; flex-shrink: 0; }

  .status-pill { font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: 0.04em; display: inline-block; margin-top: 4px; }
  .status-pill.active { color: var(--good); background: var(--good-soft); }
  .status-pill.planned { color: var(--warn); background: var(--warn-soft); }

  .empty-note { color: var(--text-faint); font-size: 12.5px; padding: 4px 0 14px; }

  .add-row-btn { background: none; border: 1px dashed var(--border-strong); color: var(--muted); font-size: 12px; font-weight: 650; padding: 9px 12px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 12px; }
  .add-row-btn:hover { color: var(--accent); border-color: var(--accent); }

  .inline-form { margin-top: 12px; padding: 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; gap: 9px; }
  .inline-form .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .inline-form input, .inline-form select {
    flex: 1; min-width: 110px; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-size: 12.5px; padding: 8px 10px; border-radius: 8px; font-family: var(--font);
  }
  .inline-form input:focus, .inline-form select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* Detail / scenario view */
  .detail-grid { display: grid; grid-template-columns: 1fr 1.05fr; gap: 20px; align-items: start; margin-top: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 26px; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 0 0 14px; }

  .opp-eyebrow { font-size: 11.5px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .opp-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
  .opp-summary { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 20px; }

  .conf-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .conf-number { font-family: var(--mono); font-size: 30px; font-weight: 800; line-height: 1; }
  .conf-number.high { color: var(--good); } .conf-number.medium { color: var(--warn); } .conf-number.low { color: var(--danger); }
  .conf-fill-track { width: 100%; height: 6px; background: var(--panel2); border-radius: var(--radius-pill); overflow: hidden; margin-top: 8px; }
  .conf-fill { height: 100%; border-radius: var(--radius-pill); }
  .conf-fill.high { background: var(--good); } .conf-fill.medium { background: var(--warn); } .conf-fill.low { background: var(--danger); }
  .conf-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }

  .cap-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .cap-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); font-size: 12.5px; padding: 7px 13px; border-radius: var(--radius-pill); }
  .cap-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .cta-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn { border-radius: var(--radius-pill); padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .btn:hover { border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.small { padding: 7px 13px; font-size: 12px; }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 11px 20px; border-radius: 10px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .wrap { padding: 26px 18px 60px; }
    .signal-columns { grid-template-columns: 1fr; }
    .setup-grid { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    .account-facts { margin-left: 0; }
  }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light / dark theme" title="Toggle light / dark theme">
  <span class="icon-moon">🌙</span><span class="icon-sun">☀️</span>
</button>

<div class="wrap" id="main"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

  var ACCOUNTS = [
    {
      id: 'vw',
      name: 'Volkswagen Group',
      industry: 'Automotive',
      icon: '🚗',
      avatar: 'VW',
      hq: 'Wolfsburg, Germany',
      revenue: '$322B (FY2025)',
      sector: 'Automotive OEM — Multi-Brand · software unit: CARIAD',
      stage: 'In Conversation',
      signalHistory: [6,7,9,10,12,14],
      activityLog: [

  function momentumChart(values){
    values = (values && values.length) ? values : [0,0,0,0,0,0];
    var w = 240, h = 46, gap = 4;
    var barW = (w / values.length) - gap;
    var max = Math.max.apply(null, values) || 1;
    var bars = values.map(function(v, i){
      var bh = Math.max(3, (v / max) * h);
      var x = i * (barW + gap);
      var y = h - bh;
      var isLast = i === values.length - 1;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2" fill="' + (isLast ? 'var(--accent)' : 'var(--accent-soft)') + '"></rect>';
    }).join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' + bars + '</svg>';
  }

          '<h2 class="opp-title">' + sc.title + '</h2>' +
          '<p class="opp-summary">' + sc.summary + '</p>' +
          '<div class="conf-row">' +
            '<div style="flex:1"><div class="conf-number ' + t + '">' + sc.confidence + '</div><div class="conf-fill-track"><div class="conf-fill ' + t + '" style="width:' + sc.confidence + '%"></div></div><div class="conf-sub">' + tierLabel(t) + ' &middot; based on ' + sc.signalIds.length + ' signals across both channels</div></div>' +
          '</div>' +
          '<p class="section-label">Included deliverables</p>' +
          '<div class="cap-row">' + capabilities + '</div>' +
          '<div class="callout accent"><b class="label">Recommended next step:</b> ' + sc.nextStep + '</div>' +
          renderContactBlock(account, sc) +
          '<div class="cta-row"><button class="btn primary" data-toast="Added to sales pipeline (demo)">Send to CRM</button><button class="btn" data-toast="Marked as reviewed (demo)">Mark as reviewed</button></div>' +
        '</div>' +
      '</div>';
  }

  function renderSignal(){
    var account = currentAccount();
    var s = findSignal(account, state.signalId);
    var src = findSource(account, s.sourceId);
    var cls = s.channel === 'news' ? 'c-newstype' : 'c-socialtype';
    var channelLabel = s.channel === 'news' ? 'News' : 'Social & Workforce Movement';
    return header() + renderBreadcrumb(account) +
      '<div class="panel" style="max-width:680px">' +
        '<div class="opp-eyebrow">' + channelLabel + ' &middot; <span class="' + cls + '">' + s.subtype + '</span></div>' +
        '<h2 class="opp-title" style="font-size:17px">' + s.date + '</h2>' +
        '<blockquote class="post-quote">' + s.text + '</blockquote>' +
        '<div class="badge-row">' +
          '<span class="tag-pill">' + (src ? src.name : 'Unverified source') + '</span>' +
          (src ? '<span class="tag-pill">' + src.type + '</span>' : '') +
        '</div>' +
      '</div>';
  }

  function render(){
    var html;
    if (state.view === 'setup') html = renderSetup();
    else if (state.view === 'activity') html = renderActivity();
    else if (state.view === 'scenario') html = renderScenario();
    else if (state.view === 'signal') html = renderSignal();
    else html = renderOverview();
    byId('main').innerHTML = html;
  }

  var toastTimer;
  function showToast(msg){
    var el = byId('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  var NEW_CLIENT_FIELD_MAP = {
    'new-client-name': 'name', 'new-client-hq': 'hq', 'new-client-revenue': 'revenue'
  };
  document.addEventListener('input', function(e){
    var key = NEW_CLIENT_FIELD_MAP[e.target.id];
    if (key){ state.newClientDraft[key] = e.target.value; }
  });

  document.addEventListener('click', function(e){
    var accountBtn = e.target.closest('[data-account]');
    if (accountBtn){ navigate(accountBtn.getAttribute('data-account'), 'overview'); return; }

    var viewTabBtn = e.target.closest('[data-view-tab]');
    if (viewTabBtn){ state.view = viewTabBtn.getAttribute('data-view-tab'); render(); return; }

    var scenarioCard = e.target.closest('[data-scenario-card]');
    if (scenarioCard){ navigate(state.accountId, 'scenario', scenarioCard.getAttribute('data-scenario-card')); return; }

    var signalCard = e.target.closest('[data-signal-card]');
    if (signalCard){
      var origin = signalCard.getAttribute('data-signal-origin');
      state.signalOrigin = { view: origin, scenarioId: origin === 'scenario' ? state.scenarioId : null };
      state.signalId = signalCard.getAttribute('data-signal-card');
      state.view = 'signal';
      window.scrollTo(0,0);
      render();
      return;
    }

    var navBtn = e.target.closest('[data-nav]');
    if (navBtn){
      var nav = navBtn.getAttribute('data-nav');
      var navAccount = navBtn.getAttribute('data-account-nav') || state.accountId;
      if (nav === 'overview') navigate(navAccount, 'overview');
      else if (nav === 'scenario') navigate(navAccount, 'scenario', navBtn.getAttribute('data-scenario-nav'));
      return;
    }

    var toggleEmail = e.target.closest('[data-toggle-email]');
    if (toggleEmail){ state.emailOpen = true; render(); return; }
    var cancelEmail = e.target.closest('[data-cancel-email]');
    if (cancelEmail){ state.emailOpen = false; render(); return; }
    var copyEmail = e.target.closest('[data-copy-email]');
    if (copyEmail){
      var account2 = currentAccount();
      var sc2 = findScenario(account2, state.scenarioId);
      var contact2 = findContact(account2, sc2.primaryContactId);
      var draft2 = draftEmail(account2, sc2, contact2);
      var fullText = 'Subject: ' + draft2.subject + '\n\n' + draft2.body;
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(fullText).then(function(){ showToast('Email copied to clipboard'); }, function(){ showToast('Could not copy — select and copy manually'); });
      } else {
        showToast('Clipboard not available — select and copy manually');
      }
      return;
    }

    var toggleAddClient = e.target.closest('[data-toggle-addclient]');
    if (toggleAddClient){
      state.addingClient = !state.addingClient;
      state.discoveredSetup = null;
      state.newClientDraft = { icon: '', name: '', industry: '', hq: '', revenue: '' };
      render();
      return;
    }
    var cancelAddClient = e.target.closest('[data-cancel-addclient]');
    if (cancelAddClient){
      state.addingClient = false;
      state.discoveredSetup = null;
      state.newClientDraft = { icon: '', name: '', industry: '', hq: '', revenue: '' };
      render();
      return;
    }
    var setSector = e.target.closest('[data-set-sector]');
    if (setSector){
      var sectorKey = setSector.getAttribute('data-set-sector');
      var sectorDef = SECTORS.filter(function(s){ return s.key === sectorKey; })[0];
      state.newClientDraft.industry = sectorKey;
      state.newClientDraft.icon = sectorDef ? sectorDef.icon : '🏢';
      render();
      return;
    }
    var discoverClient = e.target.closest('[data-discover-client]');
    if (discoverClient){
      var dName = (byId('new-client-name').value || '').trim();
      if (!dName){ showToast('Enter a client name first, then discover'); return; }
      if (!state.newClientDraft.industry){ showToast('Pick a sector first'); return; }
      state.discoveredSetup = generateStarterSetup(state.newClientDraft.industry, dName);
      render();
      showToast('Simulated starter setup generated — review before creating');
      return;
    }
    var saveAddClient = e.target.closest('[data-save-addclient]');
    if (saveAddClient){
      var name = (byId('new-client-name').value || '').trim();
      if (!name){ showToast('Enter a client name first'); return; }
      if (!state.newClientDraft.industry){ showToast('Pick a sector first'); return; }
      var icon = state.newClientDraft.icon || '🏢';
      var industry = state.newClientDraft.industry;
      var hq = (byId('new-client-hq').value || 'Not set yet').trim() || 'Not set yet';
      var revenue = (byId('new-client-revenue').value || '—').trim() || '—';
      var id = slugify(name);
      var d = state.discoveredSetup;
      var newAccount = {
        id: id, name: name, industry: industry, icon: icon, avatar: name.slice(0,3).toUpperCase(),
        hq: hq, revenue: revenue, sector: industry + ' · newly configured account',
        stage: 'Cold', signalHistory: [0,0,0,0,0,0], activityLog: [],
        departments: d ? d.departments : [], contacts: d ? d.contacts : [], sources: d ? d.sources : [],
        signals: [], scenarios: []
      };
      ACCOUNTS.push(newAccount);
      state.addingClient = false;
      state.discoveredSetup = null;
      navigate(id, 'setup');
      showToast('Client "' + name + '" created — now add sources to start ingesting');
      return;
    }

    var setStage = e.target.closest('[data-set-stage]');
    if (setStage){
      currentAccount().stage = setStage.getAttribute('data-set-stage');
      render();
      showToast('Stage set to ' + currentAccount().stage);
      return;
    }
    var toggleActivity = e.target.closest('[data-toggle-activity]');
    if (toggleActivity){ state.addingActivity = true; render(); return; }
    var cancelActivity = e.target.closest('[data-cancel-activity]');
    if (cancelActivity){ state.addingActivity = false; render(); return; }
    var saveActivity = e.target.closest('[data-save-activity]');
    if (saveActivity){
      var note = (byId('add-activity-note').value || '').trim();
      if (!note){ showToast('Enter what happened first'); return; }
      var type = byId('add-activity-type').value || 'Note';
      currentAccount().activityLog.push({ date: todayStr(), type: type, note: note });
      state.addingActivity = false;
      render();
      showToast('Activity logged');
      return;
    }

    var toggleAdd = e.target.closest('[data-toggle-add]');
    if (toggleAdd){ state.setupAdding[toggleAdd.getAttribute('data-toggle-add')] = true; render(); return; }
    var cancelAdd = e.target.closest('[data-cancel-add]');
    if (cancelAdd){ state.setupAdding[cancelAdd.getAttribute('data-cancel-add')] = false; render(); return; }
    var saveAdd = e.target.closest('[data-save-add]');
    if (saveAdd){
      var kind = saveAdd.getAttribute('data-save-add');
      var account = currentAccount();
      if (kind === 'contact'){
        var cName = (byId('add-contact-name').value || '').trim();
        if (!cName){ showToast('Enter a contact name first'); return; }
        account.contacts.push({
          name: cName,
          role: (byId('add-contact-role').value || 'Role not set').trim() || 'Role not set',
          department: (byId('add-contact-dept').value || 'Unassigned').trim() || 'Unassigned',
          channel: (byId('add-contact-channel').value || '—').trim() || '—',
          lastContact: todayStr()
        });
      } else if (kind === 'department'){
        var dName = (byId('add-department-name').value || '').trim();
        if (!dName){ showToast('Enter a department name first'); return; }
        account.departments.push({ name: dName, focus: (byId('add-department-focus').value || 'Not documented yet').trim() || 'Not documented yet' });
      } else if (kind === 'source'){
        var sName = (byId('add-source-name').value || '').trim();
        if (!sName){ showToast('Enter a source name first'); return; }
        account.sources.push({
          id: slugify(sName) + '-' + Date.now(),
          name: sName,
          type: (byId('add-source-type').value || 'General').trim() || 'General',
          channel: byId('add-source-channel').value === 'social' ? 'social' : 'news',
          status: 'Planned'
        });
      }
      state.setupAdding[kind] = false;
      render();
      showToast(kind.charAt(0).toUpperCase() + kind.slice(1) + ' added');
      return;
    }

    var toastBtn = e.target.closest('[data-toast]');
    if (toastBtn){ showToast(toastBtn.getAttribute('data-toast')); return; }
  });

  render();
})();
</script>
<script>
// Toggle light / dark theme and remember the choice.
function toggleTheme() {
  const root = document.documentElement;
  let current = root.getAttribute('data-theme');
  if (!current) {
    current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
}
</script>
</body>
