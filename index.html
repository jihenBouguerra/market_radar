  var SECTOR_COLOR = { Automotive: '#f87171', Energy: '#fbbf24', Finance: '#60a5fa', 'Pharma & Healthcare': '#34d399', Retail: '#f472b6' };

  function allScenariosFlat(){
    var out = [];
    ACCOUNTS.forEach(function(a){ a.scenarios.forEach(function(sc){ out.push({ account: a, sc: sc }); }); });
    return out;
  }

  function priorityMatrixSvg(){
    var items = allScenariosFlat();
    var w = 760, h = 340, pad = 46;
    var maxVal = Math.max.apply(null, items.map(function(x){ return x.sc.dealValue; })) || 1;
    var midVal = maxVal / 2;
    var gridY70 = pad + (1 - 70/100) * (h - 2*pad);
    var gridXMid = pad + (midVal/maxVal) * (w - 2*pad);

    var dots = items.map(function(x){
      var cx = pad + (x.sc.dealValue / maxVal) * (w - 2*pad);
      var cy = pad + (1 - effectiveConfidence(x.account, x.sc)/100) * (h - 2*pad);
      var color = SECTOR_COLOR[x.account.industry] || '#8b7cf6';
      var title = x.account.name + ' — ' + x.sc.title + ': ' + effectiveConfidence(x.account, x.sc) + '% confidence, ' + formatMoney(x.sc.dealValue);
      return '<circle class="matrix-dot" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="6" fill="' + color + '" fill-opacity="0.85" stroke="var(--panel)" stroke-width="1.5" data-scenario-account="' + x.account.id + '" data-scenario-card="' + x.sc.id + '"><title>' + title + '</title></circle>';
    }).join('');

    var legend = SECTORS.map(function(s){
      return '<span class="matrix-legend-item"><span class="matrix-legend-dot" style="background:' + (SECTOR_COLOR[s.key] || '#8b7cf6') + '"></span>' + s.key + '</span>';
    }).join('');

    return '<div class="matrix-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">' +
      '<line x1="' + pad + '" y1="' + (h-pad) + '" x2="' + (w-pad) + '" y2="' + (h-pad) + '" stroke="var(--border)" stroke-width="1"/>' +
      '<line x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (h-pad) + '" stroke="var(--border)" stroke-width="1"/>' +
      '<line x1="' + pad + '" y1="' + gridY70.toFixed(1) + '" x2="' + (w-pad) + '" y2="' + gridY70.toFixed(1) + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>' +
      '<line x1="' + gridXMid.toFixed(1) + '" y1="' + pad + '" x2="' + gridXMid.toFixed(1) + '" y2="' + (h-pad) + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>' +
      '<text x="' + pad + '" y="' + (pad-14) + '" font-size="11" fill="var(--text-faint)">Confidence ↑</text>' +
      '<text x="' + (w-pad) + '" y="' + (h-pad+22) + '" font-size="11" fill="var(--text-faint)" text-anchor="end">Estimated deal value →</text>' +
      dots +
      '</svg></div>' +
      '<div class="matrix-legend">' + legend + '</div>';
  }

  function renderPipeline(){
    var items = allScenariosFlat();
    var totalWeighted = items.reduce(function(sum, x){ return sum + (effectiveConfidence(x.account, x.sc)/100) * x.sc.dealValue; }, 0);

    var accountRows = ACCOUNTS.map(function(a){
      var sectorDef = SECTORS.filter(function(s){ return s.key === a.industry; })[0];
      var w = computeWeightedValue(a);
      return { label: (sectorDef ? sectorDef.icon : '') + ' ' + a.name, value: w, formattedValue: formatMoney(w), color: SECTOR_COLOR[a.industry] };
    }).sort(function(x, y){ return y.value - x.value; });

    var stageOrder = ['Cold','Warm','In Conversation','Won','Lost'];
    var stageColor = { Cold: 'var(--text-faint)', Warm: 'var(--warn)', 'In Conversation': 'var(--accent)', Won: 'var(--good)', Lost: 'var(--danger)' };
    var stageRows = stageOrder.map(function(s){
      var count = ACCOUNTS.filter(function(a){ return (a.stage || 'Cold') === s; }).length;
      return { label: s, value: count, formattedValue: String(count), color: stageColor[s] };
    });

    return header() + accountSwitcher() +
      '<div class="section-head"><h2>📊 Pipeline &amp; Forecast</h2></div>' +
      '<p class="section-sub">Sales math across the whole portfolio. Deal-value estimates are editable per offer — open any offer page to set your own number.</p>' +
      '<div class="callout accent"><b class="label">Total weighted pipeline:</b> ' + formatMoney(totalWeighted) + ' &middot; confidence-weighted across ' + items.length + ' offers</div>' +
      '<div class="setup-grid">' +
        '<div class="setup-panel">' +
          '<div class="setup-panel-head"><h3>💰 Weighted Value by Account</h3></div>' +
          '<p class="col-sub">Confidence % &times; estimated deal value, summed per account.</p>' +
          hBarList(accountRows) +
        '</div>' +
        '<div class="setup-panel">' +
          '<div class="setup-panel-head"><h3>📶 Accounts by Stage</h3></div>' +
          '<p class="col-sub">Where each account sits in the pipeline today.</p>' +
          hBarList(stageRows) +
        '</div>' +
      '</div>' +
      '<div class="setup-panel" style="margin-top:18px">' +
        '<div class="setup-panel-head"><h3>🎯 Priority Matrix</h3></div>' +
        '<p class="col-sub">Every offer plotted by confidence vs. estimated deal value — top-right is where to focus first. Click a dot to open that offer.</p>' +
        priorityMatrixSvg() +
      '</div>';
  }

  function renderSectorLanding(){
    var sectorKey = state.selectedSector;
    var sectorDef = SECTORS.filter(function(s){ return s.key === sectorKey; })[0];
    var sectorClients = ACCOUNTS.filter(function(a){ return a.industry === sectorKey; });
    var tiersPresent = [1,2,3,4,5,6].filter(function(t){
      return sectorClients.some(function(a){ return a.tier === t; });
    });
    var clients = state.tierFilter === 'All' ? sectorClients :
      sectorClients.filter(function(a){ return a.tier === state.tierFilter; });

    var tierFilterRow = tiersPresent.length > 1 ? '<div class="badge-row" style="margin-bottom:16px">' +
      '<button class="pill' + (state.tierFilter === 'All' ? ' primary-btn' : ' outline') + '" data-set-tierfilter="All">All tiers</button>' +
      tiersPresent.map(function(t){
        return '<button class="pill' + (state.tierFilter === t ? ' primary-btn' : ' outline') + '" data-set-tierfilter="' + t + '">T' + t + '</button>';
      }).join('') +
    '</div>' : '';

    var cards = clients.map(function(a){
      var newsCount = a.signals.filter(function(s){ return s.channel === 'news'; }).length;
      var socialCount = a.signals.filter(function(s){ return s.channel === 'social'; }).length;
      return '<div class="card" data-account="' + a.id + '">' +
        '<div class="card-title-row"><h3>' + a.icon + ' ' + a.name + '</h3><span class="pill stage-pill ' + stageClass(a.stage) + '">' + (a.stage || 'Cold') + '</span></div>' +
        '<div class="badge-row"><span class="tier-pill">T' + a.tier + '</span><span class="pill relationship-pill ' + relationshipClass(a.relationship) + '" style="cursor:default">' + (a.relationship || 'Potential Client') + '</span><span class="tag-pill">' + a.hq + '</span><span class="tag-pill">' + a.revenue + '</span></div>' +
        '<p class="card-desc">' + a.sector + '</p>' +
        '<div class="card-footer"><span class="foot-meta">' + a.scenarios.length + ' offers &middot; ' + (newsCount + socialCount) + ' signals</span><span class="foot-link">View account &rarr;</span></div>' +
      '</div>';
    }).join('');

    var items = (SECTOR_NEWS[sectorKey] || []).slice();
    items.sort(function(x, y){ return x.date < y.date ? 1 : -1; });

    var itemsHtml = items.length ? items.map(function(s){
      return '<div class="timeline-item"><div class="timeline-date">' + monthShort(s.date) + '</div>' +
        '<div><span class="evidence-type c-newstype">' + s.subtype + '</span> <span class="tag-pill">🌐 Industry-Wide</span><p>' + s.text + '</p><div class="signal-source">via ' + s.source + '</div></div></div>';
    }).join('') : '<p class="empty-note">No industry-wide news yet for this sector.</p>';

    return header() + sectorNav() +
      '<div class="section-head"><h2>' + (sectorDef ? sectorDef.icon : '') + ' ' + sectorKey + ' Clients</h2></div>' +
      '<p class="section-sub">Select a client to see its full signal feed and offers. Filter by tier to focus on your priority accounts.</p>' +
      tierFilterRow +
      '<div class="grid-3">' + (cards || '<p class="empty-note">No clients at that tier in ' + sectorKey + '.</p>') + '</div>' +
      addClientPanel() +
      '<div class="section-head"><h2>🌐 ' + sectorKey + ' — Industry-Wide News</h2></div>' +
      '<p class="section-sub">Laws and regulations affecting the whole sector — not tied to any single client. Per-client news lives on each client’s own page.</p>' +
      '<div class="signal-col">' + itemsHtml + '</div>';
  }

  function renderFollowups(){
    var rows = openFollowUps();

    function rowHtml(r){
      return '<div class="list-row">' +
        '<div class="list-row-main">' +
          '<div class="list-row-name">' + r.account.icon + ' ' + r.account.name + ' <span class="tier-pill">T' + r.account.tier + '</span></div>' +
          '<div class="list-row-sub">' + r.entry.type + ' on ' + r.entry.date + ' &middot; ' + r.entry.note + '</div>' +
        '</div>' +
        '<div class="list-row-meta">' +
          '<span class="pill stage-pill ' + FOLLOWUP_CLASS[r.status] + '">🔔 ' + r.entry.followUpDate + '</span><br>' +
          '<button class="btn small" data-account="' + r.account.id + '">Open account →</button> ' +
          '<button class="btn small" data-mark-followup-done="' + r.entry.date + '" data-followup-account="' + r.account.id + '">✓ Done</button>' +
        '</div>' +
      '</div>';
    }

    function section(title, status, emptyNote){
      var list = rows.filter(function(r){ return r.status === status; });
      return '<div class="setup-panel" style="margin-bottom:18px">' +
        '<div class="setup-panel-head"><h3>' + title + (list.length ? ' (' + list.length + ')' : '') + '</h3></div>' +
        (list.length ? list.map(rowHtml).join('') : '<p class="empty-note">' + emptyNote + '</p>') +
      '</div>';
    }

    return header() + sectorNav() +
      '<div class="section-head"><h2>🔔 Follow-Ups</h2></div>' +
      '<p class="section-sub">Every call or email still waiting on a reply, across all accounts — so nothing goes quiet by accident. Set a “follow up by” date when logging activity on any account.</p>' +
      section('🔴 Overdue — chase these', 'overdue', 'Nothing overdue. Good shape.') +
      section('🟡 Due today', 'today', 'Nothing due today.') +
      section('🔵 Coming up', 'upcoming', 'No follow-ups scheduled yet.');
  }

  function render(){
    var html;
    if (state.view === 'partners') html = renderPartners();
    else if (state.view === 'pipeline') html = renderPipeline();
    else if (state.view === 'triggers') html = renderTriggers();
    else if (state.view === 'recap') html = renderMonthlyRecap();
    else if (state.view === 'templates') html = renderTemplates();
    else if (state.view === 'cases') html = renderCaseStudies();
    else if (state.view === 'followups') html = renderFollowups();
    else if (state.view === 'search') html = renderSearch();
    else if (state.view === 'sector') html = renderSectorLanding();
    else if (state.view === 'setup') html = renderSetup();
    else if (state.view === 'activity') html = renderActivity();
    else if (state.view === 'scenario') html = renderScenario();
    else if (state.view === 'tender') html = renderTenderDetail();
    else if (state.view === 'signal') html = renderSignal();
    else html = renderOverview();
    byId('main').innerHTML = html;
  }

  var toastTimer;
  function showToast(msg){
    var el = byId('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  var NEW_CLIENT_FIELD_MAP = {
    'new-client-name': 'name', 'new-client-hq': 'hq', 'new-client-revenue': 'revenue'
  };
  document.addEventListener('input', function(e){
    var key = NEW_CLIENT_FIELD_MAP[e.target.id];
    if (key){ state.newClientDraft[key] = e.target.value; }

    if (e.target.id === 'global-search'){
      var caret = e.target.selectionStart;
      state.searchQuery = e.target.value;
      if (state.searchQuery.trim()){
        if (state.view !== 'search'){ state.viewBeforeSearch = state.view; }
        state.view = 'search';
      } else if (state.view === 'search'){
        state.view = state.viewBeforeSearch || 'sector';
      }
      render();
      // render() replaces innerHTML, so put the cursor back where it was.
      var box = byId('global-search');
      if (box){ box.focus(); try { box.setSelectionRange(caret, caret); } catch (err) {} }
    }
  });

  document.addEventListener('change', function(e){
    var reassignPersona = e.target.closest && e.target.closest('[data-reassign-persona]');
    if (reassignPersona){
      var rpContact = currentAccount().contacts[parseInt(reassignPersona.getAttribute('data-reassign-persona'), 10)];
      if (rpContact){
        rpContact.persona = reassignPersona.value;
        showToast(rpContact.name + ' reassigned to ' + rpContact.persona);
      }
      return;
    }
    var catChannel = e.target.getAttribute && e.target.getAttribute('data-signal-filter-category');
    if (catChannel){ state.signalFilters[catChannel].category = e.target.value; render(); return; }
    var timingChannel = e.target.getAttribute && e.target.getAttribute('data-signal-filter-timing');
    if (timingChannel){ state.signalFilters[timingChannel].timing = e.target.value; render(); return; }
    if (e.target.id === 'tpl-file' && e.target.files && e.target.files[0]){
      var file = e.target.files[0];
      var reader = new FileReader();
      reader.onload = function(){
        state.pendingTemplateFile = { fileName: file.name, fileDataUrl: reader.result };
        render();
        var input = byId('tpl-file');
        if (input) input.focus();
      };
      reader.readAsDataURL(file);
      return;
    }
  });

  document.addEventListener('click', function(e){
    var toggleThemeBtn = e.target.closest('[data-toggle-theme]');
    if (toggleThemeBtn){
      var root = document.documentElement;
      var cur = root.getAttribute('data-theme');
      if (!cur){ cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      var next = cur === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (err) {}
      return;
    }

    var selectSectorBtn = e.target.closest('[data-select-sector]');
    if (selectSectorBtn){ selectSector(selectSectorBtn.getAttribute('data-select-sector')); return; }

    var accountBtn = e.target.closest('[data-account]');
    if (accountBtn){ navigate(accountBtn.getAttribute('data-account'), 'overview'); return; }

    var viewTabBtn = e.target.closest('[data-view-tab]');
    if (viewTabBtn){ state.view = viewTabBtn.getAttribute('data-view-tab'); render(); return; }

    var scenarioCard = e.target.closest('[data-scenario-card]');
    if (scenarioCard){ navigate(scenarioCard.getAttribute('data-scenario-account') || state.accountId, 'scenario', scenarioCard.getAttribute('data-scenario-card')); return; }

    var signalCard = e.target.closest('[data-signal-card]');
    if (signalCard){
      var origin = signalCard.getAttribute('data-signal-origin');
      var signalAccountId = signalCard.getAttribute('data-signal-account');
      if (signalAccountId){ state.accountId = signalAccountId; }
      state.signalOrigin = {
        view: origin,
        scenarioId: origin === 'scenario' ? state.scenarioId : null
      };
      state.signalId = signalCard.getAttribute('data-signal-card');
      state.view = 'signal';
      window.scrollTo(0,0);
      render();
      return;
    }

    var navBtn = e.target.closest('[data-nav]');
    if (navBtn){
      var nav = navBtn.getAttribute('data-nav');
      var navAccount = navBtn.getAttribute('data-account-nav') || state.accountId;
      if (nav === 'overview') navigate(navAccount, 'overview');
      else if (nav === 'scenario') navigate(navAccount, 'scenario', navBtn.getAttribute('data-scenario-nav'));
      return;
    }

    var toggleEmail = e.target.closest('[data-toggle-email]');
    if (toggleEmail){ state.emailOpen = true; render(); return; }
    var cancelEmail = e.target.closest('[data-cancel-email]');
    if (cancelEmail){ state.emailOpen = false; render(); return; }

    var toggleScore = e.target.closest('[data-toggle-score]');
    if (toggleScore){ state.scoreBreakdownOpen = !state.scoreBreakdownOpen; render(); return; }

    var toggleRateCard = e.target.closest('[data-toggle-ratecard]');
    if (toggleRateCard){ state.editingRateCard = true; render(); return; }
    var cancelRateCard = e.target.closest('[data-cancel-ratecard]');
    if (cancelRateCard){ state.editingRateCard = false; render(); return; }
    var saveRateCard = e.target.closest('[data-save-ratecard]');
    if (saveRateCard){
      var rcAcct = currentAccount();
      var rcSc = findScenario(rcAcct, saveRateCard.getAttribute('data-save-ratecard'));
      var people = parseInt(byId('rc-people').value, 10);
      var days = parseInt(byId('rc-days').value, 10);
      var dayRate = parseFloat(byId('rc-dayrate').value);
      var costRate = parseFloat(byId('rc-costrate').value);
      if (!(people > 0) || !(days > 0) || !(dayRate >= 0) || !(costRate >= 0)){
        showToast('Enter valid numbers for people, days, and rates'); return;
      }
      if (costRate > dayRate){ showToast('Cost rate is above the bill rate — this deal loses money'); }
      rcSc.rateCard = { people: people, days: days, dayRate: dayRate, costRate: costRate };
      rcSc.dealValue = rcRevenue(rcSc.rateCard);
      state.editingRateCard = false;
      render();
      showToast('Economics updated — margin ' + rcMarginPct(rcSc.rateCard) + '%');
      return;
    }

    var toggleCase = e.target.closest('[data-toggle-case]');
    if (toggleCase){ state.addingCaseStudy = true; render(); return; }
    var cancelCase = e.target.closest('[data-cancel-case]');
    if (cancelCase){ state.addingCaseStudy = false; render(); return; }
    var saveCase = e.target.closest('[data-save-case]');
    if (saveCase){
      var csClient = (byId('cs-client').value || '').trim();
      if (!csClient){ showToast('Enter a client name (or an anonymised description)'); return; }
      var csTag = (byId('cs-domaintag').value || '').trim();
      CASE_STUDIES.push({
        id: 'cs-' + Date.now(),
        client: csClient,
        sector: byId('cs-sector').value,
        domainTags: csTag ? [csTag] : [],
        challenge: (byId('cs-challenge').value || '').trim() || 'Not documented yet.',
        outcome: (byId('cs-outcome').value || '').trim() || 'Not documented yet.',
        metric: (byId('cs-metric').value || '').trim() || 'No hard metric recorded',
        duration: (byId('cs-duration').value || '').trim() || 'Not recorded',
        team: (byId('cs-team').value || '').trim() || 'Not recorded',
        tech: (byId('cs-tech').value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean),
        referenceable: !!byId('cs-referenceable').checked
      });
      state.addingCaseStudy = false;
      render();
      showToast('Case study added');
      return;
    }
    var copyCase = e.target.closest('[data-copy-case]');
    if (copyCase){
      var cs = CASE_STUDIES.filter(function(x){ return x.id === copyCase.getAttribute('data-copy-case'); })[0];
      var caseText = [
        cs.client + ' (' + cs.sector + ')',
        '',
        'Challenge: ' + cs.challenge,
        'What we did: ' + cs.outcome,
        'Result: ' + cs.metric,
        'Duration: ' + cs.duration + ' · Team: ' + cs.team,
        (cs.tech || []).length ? 'Tech: ' + cs.tech.join(', ') : '',
        '',
        cs.referenceable ? 'This client may be named publicly.' : 'Use anonymised — client may not be named.'
      ].filter(Boolean).join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(caseText).then(function(){ showToast('Case study copied for your pitch'); }, function(){ showToast('Could not copy — select and copy manually'); });
      } else {
        showToast('Clipboard not available — select and copy manually');
      }
      return;
    }
    var copyEmail = e.target.closest('[data-copy-email]');
    if (copyEmail){
      var account2 = currentAccount();
      var sc2 = findScenario(account2, state.scenarioId);
      var contact2 = findContact(account2, sc2.primaryContactId);
      var draft2 = draftEmail(account2, sc2, contact2);
      var fullText = 'Subject: ' + draft2.subject + '\n\n' + draft2.body;
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(fullText).then(function(){ showToast('Email copied to clipboard'); }, function(){ showToast('Could not copy — select and copy manually'); });
      } else {
        showToast('Clipboard not available — select and copy manually');
      }
      return;
    }

    var toggleAddClient = e.target.closest('[data-toggle-addclient]');
    if (toggleAddClient){
      state.addingClient = !state.addingClient;
      state.discoveredSetup = null;
      var prefillSector = SECTORS.filter(function(s){ return s.key === state.selectedSector; })[0];
      state.newClientDraft = {
        icon: prefillSector ? prefillSector.icon : '',
        name: '', industry: prefillSector ? prefillSector.key : '', hq: '', revenue: ''
      };
      render();
      return;
    }
    var cancelAddClient = e.target.closest('[data-cancel-addclient]');
    if (cancelAddClient){
      state.addingClient = false;
      state.discoveredSetup = null;
      state.newClientDraft = { icon: '', name: '', industry: '', hq: '', revenue: '' };
      render();
      return;
    }
    var setSector = e.target.closest('[data-set-sector]');
    if (setSector){
      var sectorKey = setSector.getAttribute('data-set-sector');
      var sectorDef = SECTORS.filter(function(s){ return s.key === sectorKey; })[0];
      state.newClientDraft.industry = sectorKey;
      state.newClientDraft.icon = sectorDef ? sectorDef.icon : '🏢';
      render();
      return;
    }
    var discoverClient = e.target.closest('[data-discover-client]');
    if (discoverClient){
      var dName = (byId('new-client-name').value || '').trim();
      if (!dName){ showToast('Enter a client name first, then discover'); return; }
      if (!state.newClientDraft.industry){ showToast('Pick a sector first'); return; }
      state.discoveredSetup = generateStarterSetup(state.newClientDraft.industry, dName);
      render();
      showToast('Simulated starter setup generated — review before creating');
      return;
    }
    var saveAddClient = e.target.closest('[data-save-addclient]');
    if (saveAddClient){
      var name = (byId('new-client-name').value || '').trim();
      if (!name){ showToast('Enter a client name first'); return; }
      if (!state.newClientDraft.industry){ showToast('Pick a sector first'); return; }
      var icon = state.newClientDraft.icon || '🏢';
      var industry = state.newClientDraft.industry;
      var hq = (byId('new-client-hq').value || 'Not set yet').trim() || 'Not set yet';
      var revenue = (byId('new-client-revenue').value || '—').trim() || '—';
      var id = slugify(name);
      var d = state.discoveredSetup;
      var newAccount = {
        id: id, name: name, industry: industry, icon: icon, avatar: name.slice(0,3).toUpperCase(),
        hq: hq, revenue: revenue, sector: industry + ' · newly configured account', techStack: [],
        relationship: 'Potential Client', stage: 'Cold', signalHistory: [0,0,0,0,0,0], activityLog: [],
        departments: d ? d.departments : [], contacts: d ? d.contacts : [], sources: d ? d.sources : [],
        signals: [], scenarios: [], manualOffers: [], tenders: []
      };
      ACCOUNTS.push(newAccount);
      state.addingClient = false;
      state.discoveredSetup = null;
      navigate(id, 'setup');
      showToast('Client "' + name + '" created — now add sources to start ingesting');
      return;
    }

    var setStage = e.target.closest('[data-set-stage]');
    if (setStage){
      var newStage = setStage.getAttribute('data-set-stage');
      currentAccount().stage = newStage;
      // Won/Lost is where the learning is — ask why before moving on.
      if (newStage === 'Won' || newStage === 'Lost'){
        state.pendingOutcomeStage = newStage;
        render();
        return;
      }
      state.pendingOutcomeStage = null;
      render();
      showToast('Stage set to ' + newStage);
      return;
    }
    var cancelOutcome = e.target.closest('[data-cancel-outcome]');
    if (cancelOutcome){ state.pendingOutcomeStage = null; render(); return; }
    var saveOutcome = e.target.closest('[data-save-outcome]');
    if (saveOutcome){
      var ocAccount = currentAccount();
      var picked = document.querySelector('input[name="outcome-reason"]:checked');
      var ocReason = picked ? picked.value : OUTCOME_REASONS[0];
      var ocNote = (byId('outcome-note').value || '').trim();
      ocAccount.outcome = { stage: state.pendingOutcomeStage, reason: ocReason, note: ocNote, date: todayStr() };
      ocAccount.activityLog.push({
        date: todayStr(), type: 'Note',
        note: 'Marked ' + state.pendingOutcomeStage + ' — ' + ocReason + (ocNote ? '. ' + ocNote : '')
      });
      state.pendingOutcomeStage = null;
      render();
      showToast('Outcome recorded');
      return;
    }
    var toggleRelationship = e.target.closest('[data-toggle-relationship]');
    if (toggleRelationship){
      var relAccount = findAccount(toggleRelationship.getAttribute('data-toggle-relationship'));
      relAccount.relationship = relAccount.relationship === 'Client' ? 'Potential Client' : 'Client';
      refreshAutoTier(relAccount);
      render();
      showToast(relAccount.name + ' flagged as ' + relAccount.relationship + ' · tier now T' + relAccount.tier);
      return;
    }
    var toggleOfferEdit = e.target.closest('[data-toggle-offer-edit]');
    if (toggleOfferEdit){ state.editingOffer = true; render(); return; }
    var cancelOfferEdit = e.target.closest('[data-cancel-offer-edit]');
    if (cancelOfferEdit){ state.editingOffer = false; render(); return; }
    var saveOfferEdit = e.target.closest('[data-save-offer-edit]');
    if (saveOfferEdit){
      var eoTitle = (byId('edit-offer-title').value || '').trim();
      if (!eoTitle){ showToast('Give the offer a title first'); return; }
      var eoScenario = findScenario(currentAccount(), state.scenarioId);
      eoScenario.title = eoTitle;
      eoScenario.domainTag = (byId('edit-offer-domaintag').value || eoScenario.domainTag).trim();
      eoScenario.summary = (byId('edit-offer-summary').value || eoScenario.summary).trim();
      eoScenario.nextStep = (byId('edit-offer-nextstep').value || eoScenario.nextStep).trim();
      var eoCaps = (byId('edit-offer-capabilities').value || '').trim();
      if (eoCaps) eoScenario.capabilities = eoCaps.split(',').map(function(c){ return c.trim(); }).filter(Boolean);
      state.editingOffer = false;
      render();
      showToast('Offer updated');
      return;
    }

    var markFollowUpDone = e.target.closest('[data-mark-followup-done]');
    if (markFollowUpDone){
      var fuAccount = findAccount(markFollowUpDone.getAttribute('data-followup-account'));
      var fuEntryDate = markFollowUpDone.getAttribute('data-mark-followup-done');
      var fuEntry = fuAccount && (fuAccount.activityLog || []).filter(function(x){ return x.date === fuEntryDate && x.followUpDate; })[0];
      if (fuEntry){
        fuEntry.followUpDone = true;
        render();
        showToast('Follow-up closed for ' + fuAccount.name);
      }
      return;
    }
    var cycleCloud = e.target.closest('[data-cycle-cloud]');
    if (cycleCloud){
      var ccDept = currentAccount().departments[parseInt(cycleCloud.getAttribute('data-cycle-cloud'), 10)];
      if (ccDept){
        var ccIdx = CLOUD_PROVIDERS.indexOf(ccDept.cloudProvider || '');
        ccDept.cloudProvider = CLOUD_PROVIDERS[(ccIdx + 1) % CLOUD_PROVIDERS.length];
        render();
        if (ccDept.cloudProvider) showToast(ccDept.name + ' runs on ' + ccDept.cloudProvider);
      }
      return;
    }
    var cycleSourceState = e.target.closest('[data-cycle-sourcestate]');
    if (cycleSourceState){
      var csSource = currentAccount().sources[parseInt(cycleSourceState.getAttribute('data-cycle-sourcestate'), 10)];
      if (csSource){
        var nextState = nextSourceState(csSource);
        csSource.active = nextState.active;
        csSource.priority = nextState.priority;
        csSource.status = csSource.active ? 'Active' : 'Planned';
        render();
        showToast(csSource.name + ': ' + sourceStateLabel(csSource));
      }
      return;
    }
    var linkedinPull = e.target.closest('[data-linkedin-pull]');
    if (linkedinPull){
      var lpContact = currentAccount().contacts[parseInt(linkedinPull.getAttribute('data-linkedin-pull'), 10)];
      if (lpContact){
        // Simulated enrichment — a real build would call the LinkedIn API here.
        lpContact.linkedinPulled = true;
        lpContact.persona = personaForRole(lpContact.role);
        render();
        showToast('Pulled ' + lpContact.name + ' from LinkedIn (demo) — matched to ' + lpContact.persona);
      }
      return;
    }
    var setTierFilter = e.target.closest('[data-set-tierfilter]');
    if (setTierFilter){
      var tfVal = setTierFilter.getAttribute('data-set-tierfilter');
      state.tierFilter = (tfVal === 'All') ? 'All' : parseInt(tfVal, 10);
      render();
      return;
    }
    var setTier = e.target.closest('[data-set-tier]');
    if (setTier){
      var tierAccount = currentAccount();
      tierAccount.tier = parseInt(setTier.getAttribute('data-set-tier'), 10);
      tierAccount.tierManual = (tierAccount.tier !== computeTierFromRules(tierAccount));
      render();
      showToast('Tier set to T' + tierAccount.tier + (tierAccount.tierManual ? ' (overrides the rule)' : ''));
      return;
    }
    var resetTier = e.target.closest('[data-reset-tier]');
    if (resetTier){
      var rtAccount = currentAccount();
      rtAccount.tierManual = false;
      rtAccount.tier = computeTierFromRules(rtAccount);
      render();
      showToast('Back to the rule — T' + rtAccount.tier);
      return;
    }
    var toggleActivity = e.target.closest('[data-toggle-activity]');
    if (toggleActivity){ state.addingActivity = true; render(); return; }
    var cancelActivity = e.target.closest('[data-cancel-activity]');
    if (cancelActivity){ state.addingActivity = false; render(); return; }
    var saveActivity = e.target.closest('[data-save-activity]');
    if (saveActivity){
      var note = (byId('add-activity-note').value || '').trim();
      if (!note){ showToast('Enter what happened first'); return; }
      var type = byId('add-activity-type').value || 'Note';
      var fuDate = (byId('add-activity-followup').value || '').trim();
      currentAccount().activityLog.push({ date: todayStr(), type: type, note: note, followUpDate: fuDate || null, followUpDone: false });
      state.addingActivity = false;
      render();
      showToast('Activity logged');
      return;
    }

    var toggleManualOffer = e.target.closest('[data-toggle-manual-offer]');
    if (toggleManualOffer){ state.addingManualOffer = true; render(); return; }
    var cancelManualOffer = e.target.closest('[data-cancel-manual-offer]');
    if (cancelManualOffer){ state.addingManualOffer = false; render(); return; }
    var saveManualOffer = e.target.closest('[data-save-manual-offer]');
    if (saveManualOffer){
      var moAccount = currentAccount();
      var moTitle = (byId('mo-title').value || '').trim();
      if (!moTitle){ showToast('Enter an offer title first'); return; }
      var moSummary = (byId('mo-summary').value || '').trim();
      var moSentiment = byId('mo-sentiment').value || 'Neutral';
      var moPartnerId = byId('mo-partner').value || '';
      var moOwner = (byId('mo-owner').value || '').trim() || 'Unassigned';
      var moDate = byId('mo-date').value || todayStr();
      var moStage = byId('mo-stage').value || moAccount.stage;
      var moNote = (byId('mo-note').value || '').trim();

      moAccount.manualOffers = moAccount.manualOffers || [];
      moAccount.manualOffers.push({
        id: 'manual-' + Date.now(),
        title: moTitle, summary: moSummary, sentiment: moSentiment,
        partnerId: moPartnerId, owner: moOwner, meetingDate: moDate, stage: moStage, note: moNote
      });

      var stageChanged = moAccount.stage !== moStage;
      moAccount.stage = moStage;

      var moPartner = PARTNERS.filter(function(p){ return p.id === moPartnerId; })[0];
      var logNote = moOwner + ' logged a sales meeting for "' + moTitle + '" — client sentiment: ' + moSentiment +
        (moPartner ? '; collaboration angle: ' + moPartner.name : '') +
        (stageChanged ? '; stage moved to ' + moStage : '') +
        (moNote ? '. ' + moNote : '');
      moAccount.activityLog.push({ date: moDate, type: 'Meeting', note: logNote });

      state.addingManualOffer = false;
      render();
      showToast('Manual offer logged' + (stageChanged ? ' — stage updated to ' + moStage : ''));
      return;
    }

    var copyRoi = e.target.closest('[data-copy-roi]');
    if (copyRoi){
      var roiAccount = findAccount(copyRoi.getAttribute('data-copy-roi'));
      var revenue = parseRevenue(roiAccount.revenue);
      var costBasePct = parseFloat(byId('roi-costbase').value) || 0;
      var gainPct = parseFloat(byId('roi-gain').value) || 0;
      var estimate = revenue * (costBasePct / 100) * (gainPct / 100);
      var playbook = (USE_CASE_PLAYBOOKS[roiAccount.industry] || [])[0];
      var roiText = 'Estimated annual value for ' + roiAccount.name + ': ~' + formatMoney(estimate) +
        ' (assuming ' + costBasePct + '% of revenue is addressable, with a ' + gainPct + '% efficiency gain via ' +
        (playbook ? playbook.title : 'the proposed AI initiative') + ').';
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(roiText).then(function(){ showToast('ROI estimate copied to clipboard'); }, function(){ showToast('Could not copy — select and copy manually'); });
      } else {
        showToast('Clipboard not available — select and copy manually');
      }
      return;
    }

    var exportCrm = e.target.closest('[data-export-crm]');
    if (exportCrm){
      var crmAccount = findAccount(exportCrm.getAttribute('data-export-crm-account'));
      var crmSc = findScenario(crmAccount, exportCrm.getAttribute('data-export-crm'));
      var crmContact = findContact(crmAccount, crmSc.primaryContactId);
      var dossier = [
        'ACCOUNT: ' + crmAccount.name + ' (' + crmAccount.industry + ')',
        'HQ: ' + crmAccount.hq + ' · Revenue: ' + crmAccount.revenue,
        'Tech stack: ' + (crmAccount.techStack || []).join(', '),
        'Stage: ' + crmAccount.stage,
        '',
        'OFFER: ' + crmSc.title + ' (' + crmSc.domainTag + ')',
        'Confidence: ' + crmSc.confidence + '%  ·  Deal value: ' + formatMoney(crmSc.dealValue),
        crmSc.summary,
        '',
        'CONTACT: ' + (crmContact ? crmContact.name + ' — ' + crmContact.role + ' (' + crmContact.channel + ')' : 'Not mapped yet'),
        'Next step: ' + crmSc.nextStep
      ].join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(dossier).then(function(){ showToast('Dossier copied — paste into HubSpot/Salesforce/Outreach.io (demo)'); }, function(){ showToast('Could not copy — select and copy manually'); });
      } else {
        showToast('Clipboard not available — select and copy manually');
      }
      return;
    }

    var draftManualEmail = e.target.closest('[data-draft-manual-email]');
    if (draftManualEmail){
      var dmeAccount = findAccount(draftManualEmail.getAttribute('data-manual-email-account'));
      var dmeOffer = (dmeAccount.manualOffers || []).filter(function(m){ return m.id === draftManualEmail.getAttribute('data-draft-manual-email'); })[0];
      var dmeContact = (dmeAccount.contacts || [])[0];
      var dmeFirstName = dmeContact ? dmeContact.name.replace(/^Dr\.\s*/,'').split(' ')[0] : 'there';
      var dmeLines = [
        'Hi ' + dmeFirstName + ',',
        '',
        dmeOffer.summary || ('Following up on our conversation about ' + dmeOffer.title + '.'),
        dmeOffer.note ? ('\n' + dmeOffer.note) : '',
        '',
        'Would you be open to a short follow-up call?',
        '',
        'Best regards,',
        '[Your name]',
        '[Your Company] — Data Engineering & Software Consulting'
      ];
      var dmeText = 'Subject: Following up — ' + dmeOffer.title + '\n\n' + dmeLines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(dmeText).then(function(){ showToast('Draft email copied to clipboard'); }, function(){ showToast('Could not copy — select and copy manually'); });
      } else {
        showToast('Clipboard not available — select and copy manually');
      }
      return;
    }

    var toggleAiAsk = e.target.closest('[data-toggle-ai-ask]');
    if (toggleAiAsk){ state.aiAskOpen = true; render(); return; }
    var cancelAiAsk = e.target.closest('[data-cancel-ai-ask]');
    if (cancelAiAsk){ state.aiAskOpen = false; render(); return; }
    var copyAiPrompt = e.target.closest('[data-copy-ai-prompt]');
    if (copyAiPrompt){
      var aiAccount = findAccount(copyAiPrompt.getAttribute('data-copy-ai-prompt-account'));
      var aiSc = findScenario(aiAccount, copyAiPrompt.getAttribute('data-copy-ai-prompt'));
      var aiQuestion = (byId('ai-ask-question').value || '').trim() || 'How can I make this offer more compelling and easier to close?';
      var evidenceLines = aiSc.signalIds.map(function(id){
        var s = findSignal(aiAccount, id);
        return '- [' + s.subtype + ', ' + s.date + '] ' + s.text;
      }).join('\n');
      var promptText = [
        'You are helping a sales rep at a Data Engineering & Software Consulting firm improve a specific client offer.',
        '',
        'ACCOUNT: ' + aiAccount.name + ' (' + aiAccount.industry + ', ' + aiAccount.hq + ', revenue ' + aiAccount.revenue + ')',
        'Tech stack: ' + (aiAccount.techStack || []).join(', '),
        'Relationship: ' + (aiAccount.relationship || 'Potential Client') + ' · Deal stage: ' + aiAccount.stage,
        '',
        'OFFER: ' + aiSc.title + ' (' + aiSc.domainTag + ')',
        'Confidence: ' + aiSc.confidence + '% · Estimated deal value: ' + formatMoney(aiSc.dealValue),
        'Summary: ' + aiSc.summary,
        'Included deliverables: ' + aiSc.capabilities.join('; '),
        'Recommended next step: ' + aiSc.nextStep,
        '',
        'SIGNALS BEHIND THIS OFFER:',
        evidenceLines,
        '',
        'MY QUESTION: ' + aiQuestion
      ].join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(promptText).then(function(){ showToast('AI prompt copied — paste into Claude, ChatGPT, or your AI assistant'); }, function(){ showToast('Could not copy — select and copy manually'); });
      } else {
        showToast('Clipboard not available — select and copy manually');
      }
      return;
    }

    var toggleShowAllTenders = e.target.closest('[data-toggle-show-all-tenders]');
    if (toggleShowAllTenders){ state.showAllTenders = !state.showAllTenders; render(); return; }
    var toggleTenderImport = e.target.closest('[data-toggle-tender-import]');
    if (toggleTenderImport){ state.addingTenderImport = true; render(); return; }
    var cancelTenderImport = e.target.closest('[data-cancel-tender-import]');
    if (cancelTenderImport){ state.addingTenderImport = false; render(); return; }
    var saveTenderImport = e.target.closest('[data-save-tender-import]');
    if (saveTenderImport){
      var importAccount = currentAccount();
      var importUrl = (byId('tender-import-url').value || '').trim();
      if (!importUrl){ showToast('Paste a link first'); return; }
      importAccount.tenders = importAccount.tenders || [];
      importAccount.tenders.push({
        id: 'tender-' + Date.now(), title: guessTitleFromUrl(importUrl),
        description: 'Imported from a link — edit this description with details from the original listing.',
        deadline: todayStr(), resources: 'Not specified', relevant: true, applied: false, source: 'import', sourceUrl: importUrl
      });
      state.addingTenderImport = false;
      render();
      showToast('Call imported — edit the details to match the original listing');
      return;
    }
    var toggleTenderApplied = e.target.closest('[data-toggle-tender-applied]');
    if (toggleTenderApplied){
      var taAccount = currentAccount();
      var taId = toggleTenderApplied.getAttribute('data-toggle-tender-applied');
      var tender = (taAccount.tenders || []).filter(function(t){ return t.id === taId; })[0];
      tender.applied = !tender.applied;
      if (tender.applied){
        taAccount.activityLog.push({ date: todayStr(), type: 'Note', note: 'Applied to call for project: "' + tender.title + '" (deadline ' + tender.deadline + ').' });
      }
      render();
      showToast(tender.applied ? 'Marked as applied' : 'Marked as not applied');
      return;
    }
    var tenderCardClick = e.target.closest('[data-tender-card]');
    if (tenderCardClick && !e.target.closest('a') && !e.target.closest('button')){
      state.tenderId = tenderCardClick.getAttribute('data-tender-card');
      state.editingTender = false;
      state.view = 'tender';
      window.scrollTo(0,0);
      render();
      return;
    }
    var toggleEditTender = e.target.closest('[data-toggle-edit-tender]');
    if (toggleEditTender){ state.editingTender = true; render(); return; }
    var cancelEditTender = e.target.closest('[data-cancel-edit-tender]');
    if (cancelEditTender){ state.editingTender = false; render(); return; }
    var saveEditTender = e.target.closest('[data-save-edit-tender]');
    if (saveEditTender){
      var editAccount = currentAccount();
      var editId = saveEditTender.getAttribute('data-save-edit-tender');
      var editTender = (editAccount.tenders || []).filter(function(x){ return x.id === editId; })[0];
      var editTitle = (byId('edit-tender-title').value || '').trim();
      if (!editTitle){ showToast('Title can’t be empty'); return; }
      editTender.title = editTitle;
      editTender.description = (byId('edit-tender-desc').value || '').trim() || 'No description provided.';
      editTender.deadline = byId('edit-tender-deadline').value || editTender.deadline;
      editTender.resources = (byId('edit-tender-resources').value || 'Not specified').trim() || 'Not specified';
      editTender.relevant = !!byId('edit-tender-relevant').checked;
      var editUrlInput = byId('edit-tender-url');
      if (editUrlInput){ editTender.sourceUrl = editUrlInput.value.trim(); }
      state.editingTender = false;
      render();
      showToast('Call for project updated');
      return;
    }

    var toggleTemplate = e.target.closest('[data-toggle-template]');
    if (toggleTemplate){ state.addingTemplate = true; state.pendingTemplateFile = null; render(); return; }
    var cancelTemplate = e.target.closest('[data-cancel-template]');
    if (cancelTemplate){ state.addingTemplate = false; state.pendingTemplateFile = null; render(); return; }
    var saveTemplate = e.target.closest('[data-save-template]');
    if (saveTemplate){
      var tplName = (byId('tpl-name').value || '').trim();
      if (!tplName){ showToast('Enter a template name first'); return; }
      var tplCategory = byId('tpl-category').value || 'Other';
      var tplNotes = (byId('tpl-notes').value || '').trim();
      var tplFile = state.pendingTemplateFile;
      TEMPLATES.push({
        id: 'tpl-' + Date.now(),
        name: tplName, category: tplCategory, notes: tplNotes,
        fileName: tplFile ? tplFile.fileName : '', fileDataUrl: tplFile ? tplFile.fileDataUrl : '',
        uploadDate: todayStr()
      });
      state.addingTemplate = false;
      state.pendingTemplateFile = null;
      render();
      showToast('Template "' + tplName + '" saved');
      return;
    }

    var toggleAdd = e.target.closest('[data-toggle-add]');
    if (toggleAdd){ state.setupAdding[toggleAdd.getAttribute('data-toggle-add')] = true; render(); return; }
    var cancelAdd = e.target.closest('[data-cancel-add]');
    if (cancelAdd){ state.setupAdding[cancelAdd.getAttribute('data-cancel-add')] = false; render(); return; }
    var saveAdd = e.target.closest('[data-save-add]');
    if (saveAdd){
      var kind = saveAdd.getAttribute('data-save-add');
      var account = currentAccount();
      if (kind === 'contact'){
        var cName = (byId('add-contact-name').value || '').trim();
        if (!cName){ showToast('Enter a contact name first'); return; }
        var cRole = (byId('add-contact-role').value || 'Role not set').trim() || 'Role not set';
        account.contacts.push({
          name: cName,
          role: cRole,
          persona: byId('add-contact-persona').value || personaForRole(cRole),
          department: (byId('add-contact-dept').value || 'Unassigned').trim() || 'Unassigned',
          channel: (byId('add-contact-channel').value || '—').trim() || '—',
          language: (byId('add-contact-language').value || '').trim() || 'German, English',
          linkedinPulled: false,
          lastContact: todayStr()
        });
      } else if (kind === 'department'){
        var dName = (byId('add-department-name').value || '').trim();
        if (!dName){ showToast('Enter a department name first'); return; }
        account.departments.push({ name: dName, focus: (byId('add-department-focus').value || 'Not documented yet').trim() || 'Not documented yet', cloudProvider: '' });
      } else if (kind === 'source'){
        var sName = (byId('add-source-name').value || '').trim();
        if (!sName){ showToast('Enter a source name first'); return; }
        account.sources.push({
          id: slugify(sName) + '-' + Date.now(),
          name: sName,
          type: (byId('add-source-type').value || 'General').trim() || 'General',
          channel: byId('add-source-channel').value === 'social' ? 'social' : 'news',
          status: 'Planned',
          active: false,
          priority: 'Medium'
        });
      }
      state.setupAdding[kind] = false;
      render();
      showToast(kind.charAt(0).toUpperCase() + kind.slice(1) + ' added');
      return;
    }

    var toastBtn = e.target.closest('[data-toast]');
    if (toastBtn){ showToast(toastBtn.getAttribute('data-toast')); return; }
  });

  render();
})();
</script>
</body>
</html>
